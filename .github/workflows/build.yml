name: Build

on:
  workflow_dispatch:
  release:
    # "published" also covers pre-releases, "released" would skip them
    types: [published]

jobs:
  flatpak:
    name: "Flatpak"
    # Nothing publishes the flatpak bundles, so don't build them for releases
    if: github.event_name != 'release'
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reflection.flatpak
          manifest-path: cx.modal.Reflection.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          run-tests: true

  # The above job will build the application as a flatpak and
  # publish it as an artifact. To test it locally you can download
  # the zip artifact, extract it, install the flatpak and run it.
  # unzip reflection-x86_64.zip
  # flatpak --user install reflection.flatpak
  # flatpak run cx.modal.Reflection

  macos:
    name: macOS (${{ matrix.variant.arch }})
    runs-on: ${{ matrix.variant.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          # No x86_64 build, Homebrew doesn't provide Intel bottles for GTK and its dependencies
          - arch: arm64
            target: aarch64-apple-darwin
            # Bundled libraries come from Homebrew bottles and require the macOS version of the
            # runner. Keep this in sync with LSMinimumSystemVersion in Info.plist.in.
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-rust@v1
        with:
          targets: ${{ matrix.variant.target }}
          channel: nightly
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cache Homebrew packages
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
            /opt/homebrew
          key: ${{ runner.os }}-${{ matrix.variant.arch }}-brew-${{ hashFiles('**/Brewfile', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.variant.arch }}-brew-

      - name: Run macOS Build Script
        run: |
          chmod +x build-aux/build_macos.sh
          ./build-aux/build_macos.sh --release --app-bundle --dmg
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Build script creates artifacts in the current directory
          name: reflection-macos-${{ matrix.variant.arch }}
          path: reflection-${{ matrix.variant.arch }}.dmg
          if-no-files-found: error

      - name: Smoke test the bundle
        run: ./build-aux/smoke_test_macos.sh reflection-${{ matrix.variant.arch }}.dmg

  # Attach the DMGs to the release once all macOS builds succeeded. This is a
  # separate job so that only this one gets write access to the repository.
  publish-macos:
    name: Publish macOS DMGs
    if: github.event_name == 'release'
    needs: macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reflection-macos-*
          merge-multiple: true

      - name: Upload DMGs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" reflection-*.dmg --clobber
